<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e3b4f" />
    <title>SAHMT - GESTAO</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Aptos", "Segoe UI Variable", "Segoe UI", sans-serif;
        background: #f5f1e8;
        color: #123041;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(14, 59, 79, 0.12), transparent 38%),
          linear-gradient(180deg, #f7f2e8 0%, #f0e8dc 100%);
      }

      main {
        max-width: 420px;
        padding: 28px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 20px 60px rgba(18, 48, 65, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-family: "Bahnschrift", "Aptos Display", "Trebuchet MS", sans-serif;
        font-size: 1.6rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SAHMT - GESTAO</h1>
      <p>
        Voce esta offline. A estrutura basica do aplicativo continua disponivel, mas sincronizacoes,
        validacoes e integracoes externas so devem ocorrer com conexao ativa.
      </p>
    </main>
  </body>
</html>
